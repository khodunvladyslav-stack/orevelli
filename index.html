<head>
<meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">

<style>
:root{font-family:system-ui,-apple-system,sans-serif;color:#f9ecff;background:#170b24;font-synthesis:none}*{box-sizing:border-box}body{margin:0;min-height:100vh;background:radial-gradient(circle at 50% 0,#3b204f 0,transparent 45%),#170b24}button,input,select{font:inherit}button{cursor:pointer}main{max-width:560px;margin:auto;padding:24px 18px 110px}.header{display:flex;justify-content:space-between;align-items:center;gap:15px}.brand{font-family:Georgia,serif;letter-spacing:.17em;font-size:25px;color:#ecd49e}.eyebrow{font-size:10px;letter-spacing:.19em;color:#cdb5da}.language{background:#32203f;border:1px solid #6c4d7a;border-radius:12px;color:#fff;padding:9px}h1{font-family:Georgia,serif;font-size:28px;font-weight:400;margin:28px 0 8px}h2{font-size:20px;font-weight:550}p{line-height:1.55;color:#dbcce6}.hero{background:linear-gradient(140deg,#54406c,#281538);border:1px solid #775d8c;border-radius:24px;padding:28px 20px;position:relative;overflow:hidden;margin:25px 0}.hero:before{content:'✦';position:absolute;right:23px;top:4px;font-size:100px;color:#f1d39222}.hero h2{color:#ffe0a4;font-family:Georgia,serif;font-size:29px;margin:10px 0}.tag{font-size:11px;letter-spacing:.1em;color:#e2c98c}.gold{background:linear-gradient(90deg,#f3d6a0,#d6aa5d);color:#24152b;border:0;border-radius:12px;font-weight:700;padding:13px 18px}.grid{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:12px}.tile{background:#2a1938;border:1px solid #553b68;border-radius:19px;padding:18px;text-align:left;color:#fff;min-height:130px}.tile .emoji{font-size:28px;display:block;margin-bottom:12px}.tile strong{display:block}.tile small{display:block;color:#bda9ca;margin-top:5px}.nav{position:fixed;bottom:0;left:0;right:0;display:flex;justify-content:center;background:#21122f;border-top:1px solid #51345c;padding:8px 8px calc(8px + env(safe-area-inset-bottom))}.navInner{display:flex;width:min(560px,100%);justify-content:space-around}.nav button{border:0;background:none;color:#b9a7c8;padding:8px 12px;font-size:12px}.nav button.active{color:#f0ca83}.screen{display:none}.screen.active{display:block}.back{background:none;color:#e9d0ff;border:0;font-size:15px;padding:18px 0}.panel{border:1px solid #654876;background:#2d1b3c;border-radius:18px;padding:20px;margin:18px 0}.panel label{display:block;margin:12px 0 6px;color:#e6d5ee}.panel input,.panel select{width:100%;color:#fff;background:#1d1029;border:1px solid #75578a;padding:12px;border-radius:10px}.muted{font-size:12px;color:#bfaecb}.result{white-space:pre-line;background:#3b254a;border-left:3px solid #efcc89;border-radius:10px;padding:15px;margin-top:15px}.offer{border:1px dashed #bb9762;border-radius:14px;padding:15px;color:#eed8a9;margin-top:20px}.offer button{margin-top:12px}.notice{color:#d6b3da;font-size:12px;margin:16px 0 0}
</style></head>
<body><main>
<div class="header"><div><div class="eyebrow">✦ &nbsp; MYSTIC SPACE</div><div class="brand">OREVELLI</div></div><select class="language" id="lang" aria-label="Language"><option value="ru">🇷🇺 RU</option><option value="uk">🇺🇦 UA</option><option value="en">🇬🇧 EN</option></select></div>
<section id="home" class="screen active"><h1 data-t="welcome"></h1><p data-t="intro"></p><div class="hero"><div class="tag" data-t="dailyTag"></div><h2 data-t="dailyCard"></h2><p data-t="dailyDesc"></p><button class="gold" id="dailyBtn" data-t="openFree"></button><div id="dailyResult" aria-live="polite"></div></div><div class="grid" id="tiles"></div><p class="notice" data-t="disclaimer"></p></section>
<section id="service" class="screen"><button class="back" id="back" data-t="back"></button><h1 id="serviceTitle"></h1><p id="serviceIntro"></p><div class="panel" id="servicePanel"></div></section>
<section id="history" class="screen"><h1 data-t="history"></h1><div id="historyList"></div></section>
<section id="premium" class="screen"><h1 data-t="premium"></h1><p data-t="premiumIntro"></p><div class="panel"><p>⭐ 35 — 3 cards</p><p>⭐ 75 — Love reading</p><p>⭐ 99 — Compatibility</p><p class="muted" data-t="paymentPending"></p></div></section>
<section id="profile" class="screen"><h1 data-t="profile"></h1><div class="panel"><p data-t="profileText"></p><button class="gold" id="clearHistory" data-t="clearHistory"></button></div></section>
</main><nav class="nav"><div class="navInner"><button data-screen="home" class="active">⌂ <span data-t="home"></span></button><button data-screen="history">◷ <span data-t="history"></span></button><button data-screen="premium">★ <span data-t="premium"></span></button><button data-screen="profile">♙ <span data-t="profile"></span></button></div></nav>

const locales={

uk:{welcome:'Твій містичний простір ✨',intro:'Відкрий нові способи поглянути на власну історію.',dailyTag:'ТВІЙ РИТУАЛ НА СЬОГОДНІ',dailyCard:'Карта дня',dailyDesc:'Відкрий символічне послання сьогоднішнього дня.',openFree:'Відкрити безкоштовно',tarot:'Таро',tarotSub:'Розклади й запитання',astro:'Гороскопи',astroSub:'Прогноз за знаком',love:'Сумісність',loveSub:'Стосунки та почуття',numbers:'Нумерологія',numbersSub:'Числа життєвого шляху',back:'← На головну',home:'Головна',history:'Історія',premium:'Преміум',profile:'Профіль',disclaimer:'Розважальні інтерпретації. Не є достовірним прогнозом майбутнього.',premiumIntro:'Розширені персональні розбори з’являться після підключення оплати.',paymentPending:'Оплата Telegram Stars поки не підключена. Списань немає.',profileText:'Мова й історія зберігаються лише у цьому браузері на етапі демонстрації.',clearHistory:'Видалити історію',noHistory:'Тут поки немає результатів.',question:'Твоє запитання (необов’язково)',draw:'Вибрати 3 карти',birthday:'Дата народження',show:'Переглянути результат',yourDate:'Твоя дата народження',partnerDate:'Дата народження партнера',tarotIntro:'Символічний розклад на три карти.',astroIntro:'Короткий розважальний гороскоп за датою народження.',loveIntro:'Розважальний погляд на сумісність двох дат.',numbersIntro:'Розрахуй число життєвого шляху.',enterDates:'Вкажи правильні дати.',saved:'Збережено в історію',sign:'Твій знак',life:'Число життєвого шляху',pair:'Спільний символ пари',cards:['Зірка','Місяць','Сонце','Імператриця','Маг','Світ','Сила','Самітник','Колесо Фортуни'],signs:['Козоріг','Водолій','Риби','Овен','Телець','Близнюки','Рак','Лев','Діва','Терези','Скорпіон','Стрілець'],ideas:['Час звернути увагу на свої цілі.','Сьогодні може бути корисно проявити терпіння.','Спробуй поглянути на ситуацію інакше.']},
en:{welcome:'Your mystical space ✨',intro:'Discover new ways to reflect on your story.',dailyTag:'YOUR DAILY RITUAL',dailyCard:'Card of the day',dailyDesc:'Reveal today’s symbolic message.',openFree:'Open for free',tarot:'Tarot',tarotSub:'Readings and questions',astro:'Horoscopes',astroSub:'Your zodiac outlook',love:'Compatibility',loveSub:'Love and relationships',numbers:'Numerology',numbersSub:'Life path numbers',back:'← Back to home',home:'Home',history:'History',premium:'Premium',profile:'Profile',disclaimer:'For entertainment and reflection only. Not a factual prediction of the future.',premiumIntro:'Extended personal readings will be available after payments are connected.',paymentPending:'Telegram Stars payments are not connected yet. No charges will occur.',profileText:'During this demo your language and history are stored only in this browser.',clearHistory:'Delete history',noHistory:'No results here yet.',question:'Your question (optional)',draw:'Draw 3 cards',birthday:'Birth date',show:'Show result',yourDate:'Your birth date',partnerDate:'Partner’s birth date',tarotIntro:'A symbolic three-card reading.',astroIntro:'A short entertainment horoscope based on your birth date.',loveIntro:'An entertainment look at two birth dates.',numbersIntro:'Calculate your life path number.',enterDates:'Please enter valid dates.',saved:'Saved to history',sign:'Your sign',life:'Life path number',pair:'Shared symbol',cards:['Star','Moon','Sun','Empress','Magician','World','Strength','Hermit','Wheel of Fortune'],signs:['Capricorn','Aquarius','Pisces','Aries','Taurus','Gemini','Cancer','Leo','Virgo','Libra','Scorpio','Sagittarius'],ideas:['Take time to consider your goals.','Patience may serve you well today.','Try looking at the situation from a fresh angle.']}};
const categories=[['tarot','🃏'],['astro','♈'],['love','💞'],['numbers','🔢']];let lang=localStorage.getItem('orevelli_lang')||'ru',category='tarot';if(!locales[lang])lang='ru';const t=k=>locales[lang][k];const $=id=>document.getElementById(id);const escapeHtml=x=>String(x).replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
function show(id){document.querySelectorAll('.screen').forEach(el=>el.classList.toggle('active',el.id===id));document.querySelectorAll('.nav button').forEach(el=>el.classList.toggle('active',el.dataset.screen===id));if(id==='history')renderHistory();window.scrollTo(0,0)}
function getHistory(){try{const value=JSON.parse(localStorage.getItem('orevelli_history')||'[]');return Array.isArray(value)?value:[]}catch{return []}}
function save(kind,result){const h=getHistory();h.unshift({kind,content:result,date:new Date().toISOString()});localStorage.setItem('orevelli_history',JSON.stringify(h.slice(0,30)))}
function renderHistory(){$('historyList').innerHTML=getHistory().map(h=>`<div class="panel"><div class="muted">${escapeHtml(new Date(h.date).toLocaleDateString(lang))} · ${escapeHtml(t(h.kind)||h.kind)}</div><div class="result">${escapeHtml(h.content)}</div></div>`).join('')||`<p>${escapeHtml(t('noHistory'))}</p>`}
function sign(date){const d=new Date(`${date}T12:00:00`);if(!Number.isFinite(+d))return null;const month=d.getMonth()+1,day=d.getDate();const breaks=[[1,20],[2,19],[3,21],[4,20],[5,21],[6,21],[7,23],[8,23],[9,23],[10,23],[11,22],[12,22]];return(day<breaks[month-1][1]?month-1:month)%12}
function life(date){if(!/^\d{4}-\d{2}-\d{2}$/.test(date)||!Number.isFinite(Date.parse(`${date}T12:00:00`)))return null;let n=date.replaceAll('-','').split('').reduce((a,b)=>a+Number(b),0);while(n>9)n=String(n).split('').reduce((a,b)=>a+Number(b),0);return n}
function generate(){const area=$('resultArea');let result='';if(category==='tarot'){const list=[...t('cards')].sort(()=>Math.random()-.5).slice(0,3);result=list.map((x,i)=>`${i+1}. ${x}`).join('\n')+'\n\n'+t('ideas')[Math.floor(Math.random()*3)]}else{const dates=Array.from($('servicePanel').querySelectorAll('input[type="date"]')).map(x=>x.value);if(dates.some(x=>!x)||dates.some(x=>life(x)===null)){area.textContent=t('enterDates');return}if(category==='astro'){const s=sign(dates[0]);result=`${t('sign')}: ${t('signs')[s]}\n${t('ideas')[s%3]}`}if(category==='numbers')result=`${t('life')}: ${life(dates[0])}\n${t('ideas')[life(dates[0])%3]}`;if(category==='love')result=`${t('pair')}: ${t('signs')[sign(dates[0])]} + ${t('signs')[sign(dates[1])]}\n${t('ideas')[(life(dates[0])+life(dates[1]))%3]}`;}area.textContent=result;save(category,result)}
function openCategory(kind){category=kind;$('serviceTitle').textContent=t(kind);$('serviceIntro').textContent=t(kind+'Intro');let content='';if(kind==='tarot')content=`<label>${escapeHtml(t('question'))}</label><input maxlength="250" placeholder="…">`;else{const labels=kind==='love'?['yourDate','partnerDate']:['birthday'];content=labels.map(k=>`<label>${escapeHtml(t(k))}</label><input type="date" min="1900-01-01" max="${new Date().toISOString().slice(0,10)}">`).join('')}content+=`<p><button id="generate" class="gold">${escapeHtml(t(kind==='tarot'?'draw':'show'))}</button></p><div id="resultArea" class="result" aria-live="polite" hidden></div>`;$('servicePanel').innerHTML=content;$('generate').onclick=()=>{$('resultArea').hidden=false;generate()};show('service')}
function render(){document.documentElement.lang=lang;$('lang').value=lang;document.querySelectorAll('[data-t]').forEach(el=>el.textContent=t(el.dataset.t));$('tiles').innerHTML=categories.map(([kind,emoji])=>`<button class="tile" data-kind="${kind}"><span class="emoji">${emoji}</span><strong>${escapeHtml(t(kind))}</strong><small>${escapeHtml(t(kind+'Sub'))}</small></button>`).join('');document.querySelectorAll('[data-kind]').forEach(el=>el.onclick=()=>openCategory(el.dataset.kind));if($('service').classList.contains('active'))openCategory(category);if($('history').classList.contains('active'))renderHistory()}
$('lang').onchange=e=>{lang=e.target.value;localStorage.setItem('orevelli_lang',lang);render()};$('dailyBtn').onclick=()=>{const date=new Date().toISOString().slice(0,10),idx=[...date].reduce((n,c)=>n+c.charCodeAt(0),0)%t('cards').length;$('dailyResult').className='result';$('dailyResult').textContent=t('cards')[idx]+' ✦\n'+t('ideas')[idx%3]};$('back').onclick=()=>show('home');document.querySelectorAll('[data-screen]').forEach(el=>el.onclick=()=>show(el.dataset.screen));$('clearHistory').onclick=()=>{localStorage.removeItem('orevelli_history');renderHistory()};render();
</script></body></html>
